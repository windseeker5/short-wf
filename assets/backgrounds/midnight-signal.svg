<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#101d2c"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#25c8e8" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#16647b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="1" cy="0.88" r="0.7">
      <stop offset="0" stop-color="#e99a45" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#714820" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#8ccfe0" stroke-opacity="0.055" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#b6e9f3" fill-opacity="0.09"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee7f5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ee7f5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ee7f5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#base)"/>
  <rect width="1080" height="1920" fill="url(#cyan)"/>
  <rect width="1080" height="1920" fill="url(#amber)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>

  <!-- Broad signal contours: visible in the narrow gutters around a phone. -->
  <g fill="none" stroke="#7ce3ef" stroke-opacity="0.075" stroke-width="3">
    <path d="M-260 520 C180 300 850 350 1290 710"/>
    <path d="M-300 610 C180 375 870 425 1340 805"/>
    <path d="M-340 710 C180 455 890 505 1380 905"/>
  </g>
  <g fill="none" stroke="#f0aa5c" stroke-opacity="0.065" stroke-width="3">
    <path d="M-210 1550 C240 1280 850 1330 1270 1670"/>
    <path d="M-270 1660 C220 1370 880 1420 1330 1790"/>
  </g>

  <!-- Two restrained light seams give the set a physical studio feel. -->
  <path d="M62 280 V1640" stroke="url(#edge)" stroke-width="4"/>
  <path d="M1018 280 V1640" stroke="url(#edge)" stroke-width="4"/>
  <ellipse cx="540" cy="1860" rx="390" ry="90" fill="#1dd5e8" fill-opacity="0.08" filter="url(#blur)"/>
  <rect x="1" y="1" width="1078" height="1918" rx="46" fill="none" stroke="#9aeaf2" stroke-opacity="0.13" stroke-width="2"/>
</svg>
